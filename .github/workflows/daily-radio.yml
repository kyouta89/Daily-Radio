name: Daily Radio Automation

# いつ実行するか？
on:
  schedule:
    # 日本時間 平日 朝6:00 に実行。UTC 21:00 は翌日のJSTなので、
    # UTCの日〜木(0-4)を指定すると JST の月〜金になる。土日は起動しない。
    # （祝日は index.js 側でスキップ判定する。cronでは表現できないため）
    - cron: "0 21 * * 0-4"
  # GitHubの画面からポチッと手動実行もできるようにする設定
  workflow_dispatch:
    inputs:
      force_run:
        description: "土日祝でも・本日分が既にあっても強制生成する（検証用）"
        type: boolean
        default: false

jobs:
  run-script:
    runs-on: ubuntu-latest

    # 想定外のハングでも60分で強制終了（6時間放置を防ぐ。超過すると失敗=通知が飛ぶ）。
    # 正常実行は数分〜十数分なので余裕。
    timeout-minutes: 60

    # タイムゾーンを日本に設定
    env:
      TZ: "Asia/Tokyo"

    steps:
      # 1. コードをチェックアウト（ダウンロード）
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node.jsの環境を用意
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. ffmpegをインストール（apt-get update を先に実行しないと
      #    ランナーのキャッシュにある古い .deb URL が 404 で失敗する）
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # 4. 必要なライブラリをインストール
      - name: Install dependencies
        run: npm ci

      # 5. スクリプト実行！
      - name: Run Daily Radio
        run: node index.js
        env:
          # 手動実行でチェックを入れたときだけ "true" が入る。
          # cron実行では空になるため、平日ガード・重複ガードは通常どおり効く。
          FORCE_RUN: ${{ inputs.force_run }}

          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          # Cloudflare R2
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_BUCKET_NAME: ${{ secrets.CF_BUCKET_NAME }}
          CF_PUBLIC_URL: ${{ secrets.CF_PUBLIC_URL }}
          # 秘匿配信用プレフィックス（設定時のみ全オブジェクトを <prefix>/ 配下へ）。
          # 未設定なら従来どおりルート直下。旧URLを知る第三者を締め出す用途。
          R2_SECRET_PREFIX: ${{ secrets.R2_SECRET_PREFIX }}

          # 死活監視（Healthchecks.io）。未設定でも動作（pingしないだけ）。
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
