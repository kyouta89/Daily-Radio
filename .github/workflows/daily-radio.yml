name: Daily Radio Automation

# いつ実行するか？
on:
  schedule:
    # 毎日 日本時間 朝6:00 (UTC 21:00) に実行
    - cron: "0 21 * * *"
  # GitHubの画面からポチッと手動実行もできるようにする設定
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    # タイムゾーンを日本に設定
    env:
      TZ: "Asia/Tokyo"

    steps:
      # 1. コードをチェックアウト（ダウンロード）
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node.jsの環境を用意
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # 3. ffmpegをインストール
      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      # 4. 必要なライブラリをインストール
      - name: Install dependencies
        run: npm ci

      # 5. スクリプト実行！
      - name: Run Daily Radio
        run: node index.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          # Cloudflare R2
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_BUCKET_NAME: ${{ secrets.CF_BUCKET_NAME }}
          CF_PUBLIC_URL: ${{ secrets.CF_PUBLIC_URL }}
